<script>
const N='http://www.w3.org/2000/svg';
const r=document.getElementById('rays');for(let i=0;i<36;i++){const a=i*10*Math.PI/180;const p=document.createElementNS(N,'path');const w=0.06;
p.setAttribute('d',`M512 440 L${512+480*Math.cos(a-w)} ${440+480*Math.sin(a-w)} L${512+480*Math.cos(a+w)} ${440+480*Math.sin(a+w)}Z`);p.setAttribute('fill','#d6a84e');p.setAttribute('opacity',i%2?'.25':'.5');r.appendChild(p);}
const d=document.getElementById('dots');for(let i=0;i<24;i++){const a=(i*15+7.5)*Math.PI/180; if(Math.sin(a)<-0.15) continue; const c=document.createElementNS(N,'circle');c.setAttribute('cx',512+278*Math.cos(a));c.setAttribute('cy',440+278*Math.sin(a));c.setAttribute('r',5);c.setAttribute('fill','#d6a84e');d.appendChild(c);}
document.fonts.ready.then(()=>document.title='done');
</script></body></html>
